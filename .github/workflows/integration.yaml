name: Run tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  collect-integration-tests:
    name: Collect integration test spread jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up environment
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest

      - name: Collect spread jobs
        id: collect-jobs
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess

          spread_jobs = (
              subprocess.run(
                  [pathlib.Path.home() / "go/bin/spread", "-list", "github-ci"],
                  capture_output=True,
                  check=True,
                  text=True,
              )
              .stdout.strip()
              .split("\n")
          )


          jobs = []
          for job in spread_jobs:
              # Example: "github-ci:self-hosted-linux-amd64-noble-large:tests/spread/basic"
              _, runner, task = job.split(":")
              task_name = task.removeprefix("tests/spread/")

              if "arm64" in runner:
                  architecture = "arm64"
              else:
                  architecture = "amd64"

              name = f"{task_name} | {architecture} ({runner})"
              name_in_artifact = f"{task_name}-{architecture}-{runner}"
              jobs.append({
                  "spread_job": job,
                  "name": name,
                  "name_in_artifact": name_in_artifact,
                  "runner": runner,
                  "arch": architecture
              })

          output = f"jobs={json.dumps(jobs)}"
          print(output)
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(output)
    outputs:
      jobs: ${{ steps.collect-jobs.outputs.jobs }}

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.collect-integration-tests.outputs.jobs) }}
    name: ${{ matrix.job.name }}
    needs:
      - collect-integration-tests
    runs-on: ${{ matrix.job.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up spread
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest

      - name: Download packed charm(s)
        uses: actions/download-artifact@v8
        with:
          name: polaris-${{ matrix.job.arch }}
          path: polaris
          merge-multiple: true

      - name: Run spread job
        timeout-minutes: 110
        id: spread
        run: |
          mv polaris/*.tar .
          ~/go/bin/spread -vv '${{ matrix.job.spread_job }}'
