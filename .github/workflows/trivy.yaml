name: Trivy scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan
    permissions:
      contents: read
      security-events: write # Required for uploading Trivy SARIF results
      actions: read
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install rockcraft (for skopeo)
        run: |
          sudo snap install rockcraft --classic

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: charmed-polaris-${{ matrix.arch }}
          path: charmed-polaris

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: .cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Import image locally
        run: |
          rockcraft.skopeo --insecure-policy copy \
            docker-archive:$(find charmed-polaris -type f -name "*.tar") \
            docker-daemon:trivy/charmed-polaris-${{ matrix.arch }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "trivy/charmed-polaris-${{ matrix.arch }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"
          trivyignores: .trivyignore

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: ${{ matrix.arch }}
