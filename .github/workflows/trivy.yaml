name: Trivy scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan
    permissions:
      contents: read
      security-events: write # Required for uploading Trivy SARIF results
      actions: read
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install rockcraft (for skopeo)
        run: |
          sudo snap install rockcraft --classic

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: polaris-${{ matrix.arch }}
          path: polaris

      - name: Import locally
        run: |
          rockcraft.skopeo --insecure-policy copy \
            docker-archive:$(find polaris -type f -name "*.tar") \
            docker-daemon:trivy/polaris-${{ matrix.arch }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "trivy/polaris-${{ matrix.arch }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: ${{ matrix.arch }}
