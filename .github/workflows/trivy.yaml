name: Trivy scan

on:
  workflow_call:
    inputs:
      submit_dependency_graph:
        description: "Submit SBOM to GitHub Dependency Graph"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install rockcraft (for skopeo)
        run: |
          sudo snap install rockcraft --classic

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: charmed-polaris-${{ matrix.arch }}
          path: charmed-polaris

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: .cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Import image locally
        run: |
          rockcraft.skopeo --insecure-policy copy \
            docker-archive:$(find charmed-polaris -type f -name "*.tar") \
            docker-daemon:trivy/charmed-polaris-${{ matrix.arch }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        # v0.36.0
        with:
          image-ref: "trivy/charmed-polaris-${{ matrix.arch }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"
          trivyignores: .trivyignore

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: ${{ matrix.arch }}

      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        # v0.36.0
        if: ${{ inputs.submit_dependency_graph }}
        with:
          scan-type: "image"
          format: "github"
          output: "dependency-results-${{ matrix.arch }}.sbom.json"
          image-ref: "trivy/charmed-polaris-${{ matrix.arch }}:${{ github.sha }}"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
