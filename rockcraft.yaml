name: charmed-polaris
base: bare
build-base: ubuntu@24.04
version: "1.6.0"
summary: Apache Polaris rock OCI
description: |
  This is an OCI image that bundles Apache Polaris together with other tools
  of its ecosystem in order to be used in Charmed Operators, providing
  automated operations management from day 0 to day 2 on the Apache Polaris
  catalog for Apache Iceberg, on top of a K8s cluster. It is an open source,
  end-to-end, production ready data platform on top of cloud native
  technologies.
license: Apache-2.0
source-code: https://github.com/canonical/charmed-polaris-rock
issues: https://github.com/canonical/charmed-polaris-rock/issues/new/choose

platforms:
  amd64:
  arm64:

run_user: _daemon_

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-${CRAFT_ARCH_BUILD_FOR}

services:
  polaris:
    command: bin/server
    working-dir: /opt/polaris/
    summary: "Service to startup Polaris server."
    override: replace
    startup: enabled
    on-success: shutdown
    on-failure: shutdown

parts:
  polaris:
    plugin: nil
    source: https://github.com/canonical/central-uploader/releases/download/polaris-1.6.0-ubuntu0/polaris-1.6.0-ubuntu0-20260715173133.tgz
    source-checksum: sha512/850d3c06a7feddf2d04342e99f379dce1a3b9484c98298f15c53410bd03e8d037541d71976e4a6bc6e16bbc30d036af20cc0556895cd15f1b52504316cf799f5
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/opt/polaris

      cp -r admin $CRAFT_PART_INSTALL/opt/polaris/
      cp -r bin $CRAFT_PART_INSTALL/opt/polaris/
      cp -r server $CRAFT_PART_INSTALL/opt/polaris/
      cp -r LICENSE $CRAFT_PART_INSTALL/opt/polaris/
      cp -r NOTICE $CRAFT_PART_INSTALL/opt/polaris/

      # Note: the Polaris bin distribution is composed of two applications
      # (server and admin) with numerous common jars.
      # Upstream made the choice of having two different images, whereas bundling the admin
      # tool with the server fits better our approach to charming operators.
      # By converting files under polaris/admin into hard links to their polaris/server counterpart,
      # the OCI layer stores them only once.
      while IFS= read -r -d '' admin_file; do
        rel_path="${admin_file#$CRAFT_PART_INSTALL/opt/polaris/admin/}"
        server_file="$CRAFT_PART_INSTALL/opt/polaris/server/$rel_path"

        if [ -f "$server_file" ] \
          && [ "$(stat -c %s "$admin_file")" -eq "$(stat -c %s "$server_file")" ] \
          && cmp -s "$admin_file" "$server_file"; then
          rm "$admin_file"
          ln "$server_file" "$admin_file"
        fi
      done < <(find "$CRAFT_PART_INSTALL/opt/polaris/admin" -type f -print0)

    stage:
      - opt/polaris

  runtime:
    plugin: nil
    # We need bash, /usr/bin/env, env, dirname, pwd for the entrypoint.
    # For Polaris itself we need the JRE, the native management libs and keytool.
    stage-packages:
      - base-files_base
      - bash_bins
      - coreutils_dirname
      - coreutils_env
      - coreutils_working-context
      - openjdk-21-jre-headless_console
      - openjdk-21-jre-headless_core
      - openjdk-21-jre-headless_management
      - openjdk-21-jre-headless_security
      - openjdk-21-jre-headless_tools

  non-root-user:
    after: [polaris, runtime]
    plugin: nil
    override-prime: |
      POLARIS_GID=584792
      POLARIS_UID=584792

      craftctl default
      chown -R ${POLARIS_UID}:${POLARIS_GID} opt/polaris
      chmod -R 750 opt/polaris
      install -d -o ${POLARIS_UID} -g ${POLARIS_GID} -m 770 etc/polaris
